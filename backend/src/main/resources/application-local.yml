spring:
  application:
    name: voltwise-core
  datasource:
    url: jdbc:h2:mem:voltwise;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  kafka:
    listener:
      auto-startup: false
voltwise:
  kafka:
    enabled: false
  ignite:
    enabled: false
  billing:
    default-monthly-budget: 1000.00
    normal-tariff-per-kwh: 2.50
    penalty-tariff-multiplier: 1.50
