spring:
  application:
    name: voltflow-core
  datasource:
    url: jdbc:h2:mem:voltflow;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  kafka:
    listener:
      auto-startup: false
  mail:
    host: smtp.sendgrid.net
    port: 587
    username: apikey
    password: ${SENDGRID_API_KEY:}
    properties.mail.smtp:
      auth: true
      starttls.enable: true
      connectiontimeout: 5000
      timeout: 5000
      writetimeout: 5000

voltflow:
  kafka:
    enabled: false
  ignite:
    enabled: false
  billing:
    default-monthly-budget: 1000.00
    normal-tariff-per-kwh: 2.50
    penalty-tariff-multiplier: 1.50
  mail:
    enabled: true
    from: ${MAIL_FROM:noreply@voltflow.space}
