spring:
  datasource:
    url: jdbc:h2:mem:voltwise;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  task:
    scheduling:
      enabled: false
voltwise:
  kafka:
    enabled: false
  ignite:
    enabled: false
  snapshots:
    interval-ms: 3600000
logging:
  level:
    org.hibernate.SQL: warn
